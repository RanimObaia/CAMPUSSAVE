name: campussave
description: CampusSave mobile app (Flutter) - anti food-waste platform for ESSECT students.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  qr_flutter: ^4.1.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.3
  material_ui: ^1.11.1
  # Notifications push (firebase_messaging) : à ajouter avec le fichier
  # google-services.json du projet Firebase ; en attendant, l'app lit les
  # notifications dans l'API (cloche + onglet Moi).

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/photos/
